<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación con Sonido</title>

    <link rel="stylesheet" href="style.css">

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>

    <!-- Howler -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

</head>

<body>

    <h1>Escena Animada con Sonido</h1>

    <p>Haz clic sobre el paisaje para iniciar el sonido.</p>

    <div id="paisaje">

        <img id="nube" class="objeto"
            src="https://icons.iconarchive.com/icons/flaticonmaker/flat-style/128/cloud-icon.png"
            alt="Nube">

        <img id="bici" class="objeto"
            src="https://icons.iconarchive.com/icons/aha-soft/transport/128/bike-icon.png"
            alt="Bicicleta">

        <img id="arbol" class="objeto"
            src="https://icons.iconarchive.com/icons/google/noto-emoji-animals-nature/128/22330-deciduous-tree-icon.png"
            alt="Árbol">

        <img id="sol" class="objeto"
            src="https://icons.iconarchive.com/icons/dapino/beach/128/sun-icon.png"
            alt="Sol">

        <img id="nevado" class="objeto"
            src="https://icons.iconarchive.com/icons/google/noto-emoji-travel-places/512/42462-mountain-icon.png"
            alt="Montaña">

        <img id="nevado2" class="objeto"
            src="https://icons.iconarchive.com/icons/google/noto-emoji-travel-places/512/42462-mountain-icon.png"
            alt="Montaña">

    </div>

    <script src="script.js"></script>

</body>

</html>
