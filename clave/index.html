<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Bancario Femenino</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="header">
            <h2>Mi Banco 🌸</h2>
            <p>Ingresa tu clave virtual</p>
        </div>
        
        <input type="password" id="password-input" readonly placeholder="Clave acá">

        <div id="keypad" class="keypad">
            <!-- Los 10 botones numéricos -->
            <button class="num-key"></button>
            <button class="num-key"></button>
            <button class="num-key"></button>
            <button class="num-key"></button>
            <button class="num-key"></button>
            <button class="num-key"></button>
            <button class="num-key"></button>
            <button class="num-key"></button>
            <button class="num-key"></button>
            <button class="num-key"></button>
            
            <!-- Botón de borrar que ocupa el espacio restante -->
            <button id="btn-borrar" class="action-key">Borrar</button>
        </div>

        <button id="btn-confirmar" class="confirm-key">Confirmar</button>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
